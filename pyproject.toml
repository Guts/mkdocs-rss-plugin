[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools-scm>=8"]

[project]
name = "mkdocs-rss-plugin"
description = "MkDocs plugin to generate RSS and JSON feeds using Mkdocs site configuration, git log and Mkdocs pages'meta."
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Julien Moura", email = "dev@ingeoveritas.com" }]
maintainers = [{ name = "Julien Moura", email = "dev@ingeoveritas.com" }]
keywords = [
    "atom",
    "documentation",
    "feed",
    "git",
    "json-feed",
    "mkdocs",
    "plugin",
    "rss",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "CacheControl[filecache]>=0.14.3,<1",
    "GitPython>=3.2.1,<3.3",
    "requests>=2.32.5,<3",
    "tzdata>=2024,<2027 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff>=0.17.2", "pre-commit>=4.6,<5"]

docs = [
    "mkdocs-git-committers-plugin-2>=2.4.1,<2.6",
    "mkdocs-materialx[imaging]>=10.2.2,<11",
    "mkdocs-minify-plugin>=0.8,<0.9",
    "mkdocstrings-python>=1.16.2,<2.1",
    "termynal>=0.12.2,<0.15",
]

mkdocs = ["mkdocs>=1.6.1,<2"]

properdocs = ["properdocs>=1.6.7,<2"]

test = [
    "feedparser>=6.0.12,<6.1",
    "jsonfeed-util>=1.2,<2",
    "mkdocs-material[imaging]>=9.7,<9.8",
    "mkdocs-materialx[imaging]>=10.1.3,<11",
    "pytest-cov>=6.9.1,<8",
    "validator-collection>=1.5,<1.6",
]

[project.entry-points."mkdocs.plugins"]
rss = "mkdocs_rss_plugin.plugin:GitRssPlugin"

[project.urls]
Changelog = "https://github.com/guts/mkdocs-rss-plugin/blob/main/CHANGELOG.md"
Documentation = "https://guts.github.io/mkdocs-rss-plugin/"
Homepage = "https://guts.github.io/mkdocs-rss-plugin/"
Issues = "https://github.com/guts/mkdocs-rss-plugin/issues/"
releasenotes = "https://github.com/guts/mkdocs-rss-plugin/releases/latest"
Repository = "https://github.com/guts/mkdocs-rss-plugin/"


# -- TOOLING CONFIGURATION --

# Coverage configuration
[tool.coverage.report]
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    "class .*\\bProtocol\\):",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug:",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about imports for type checking:
    "if TYPE_CHECKING:",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # ignore lines marked with a pragma
    "pragma: no cover",
]
ignore_errors = true
show_missing = true

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/_version.py"]

# Pytest configuration
[tool.pytest.ini_options]
addopts = [
    "--junitxml=junit/test-results.xml",
    "--cov=mkdocs_rss_plugin",
    "--cov-config=pyproject.toml",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
    "--ignore=tests/_wip/",
]
junit_family = "xunit2"
minversion = "7.0"
norecursedirs = ".* build dev development dist docs CVS fixtures _darcs {arch} *.egg venv _wip"
python_files = ["test_*.py"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", "__pycache__", "old", "build", "dist", "tests/dev", ".venv*"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "E",   # pycodestyle errors
    "ERA", # eradicate (commented code)
    "F",   # pyflakes
    "I",   # isort
    "LOG", # flake8-logging
    "N",   # pep8-naming
    "PTH", # flake8-pathlib
    "S",   # bandit security
    "TC",  # flake8-type-checking
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

ignore = [
    "ANN201", # Missing return type annotation for public function
    "ANN204", #  Missing return type annotation for special method `__init__`
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
    "E501",   # line too long (handled by ruff format)
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files
"__init__.py" = ["E402"]
# Ignore rules in tests
"tests/test_*.py" = ["ANN001", "ANN2", "S101", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"


# Setuptools configuration
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mkdocs_rss_plugin = ["templates/*.jinja2"]

[tool.setuptools.packages.find]
include = ["mkdocs_rss_plugin"]
namespaces = false
where = ["."]

# setuptools-scm configuration
[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
write_to = "mkdocs_rss_plugin/_version.py"
